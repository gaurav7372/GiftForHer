<section id="reasons" class="reasons-section">

    <div class="container">

        <h2 class="section-title gradient-text">
            💖 12 Reasons You're Amazing
        </h2>

        <div class="row g-4">

            <div
                class="col-lg-3 col-md-4 col-6"
                *ngFor="let item of reasons">

                <div class="reason-card glass">

                    <div class="emoji">

                        {{item.icon}}

                    </div>

                    <h5>

                        {{item.title}}

                    </h5>

                    <p>

                        {{item.text}}

                    </p>

                </div>

            </div>

        </div>

    </div>

</section>
